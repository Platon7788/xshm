[package]
name = "xshm"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
description = "High-performance cross-process shared memory IPC using direct NT API calls"
authors = ["Platon"]
license = "MIT"
repository = "https://github.com/Platon7788/xshm"
# Только path-зависимость потребителей (не crates.io): иначе `cargo deny
# bans` у них считает path-dep «wildcard».
publish = false

[lib]
name = "xshm"
crate-type = ["rlib"]

[dependencies]
thiserror = "2"

# Без внешних зависимостей для NT API!
# Используем прямую линковку с ntdll.dll через #[link(name = "ntdll")]

[features]
default = []

# Политика линтов живёт в манифесте (Cargo 1.74+), а не в атрибутах крейта:
# так она распространяется на все таргеты (lib, tests) единообразно и видна
# сразу при чтении манифеста.
[lints.rust]
# В edition 2024 это дефолт, но `forbid` не даёт локально ослабить правило.
unsafe_op_in_unsafe_fn = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Правило проекта №3 (CLAUDE.md): у каждого unsafe -- обоснование. Теперь это
# проверяет компилятор, а не ревьюер.
undocumented_unsafe_blocks = "deny"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
missing_const_for_fn = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
