[package]
name = "xshm"
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
description = "High-performance cross-process shared memory IPC using direct NT API calls"
authors = ["Platon"]
license = "MIT"
repository = "https://github.com/Platon7788/xshm"
# Только path-зависимость потребителей (не crates.io): иначе `cargo deny
# bans` у них считает path-dep «wildcard».
publish = false

[workspace]
resolver = "3"
members = [".", "crates/xipc-sys"]
default-members = ["."]

[lib]
name = "xshm"
crate-type = ["rlib"]

[dependencies]
thiserror = "2.0.21"
xipc-sys = { path = "crates/xipc-sys", optional = true }

# Без внешних зависимостей для NT API!
# Используем прямую линковку с ntdll.dll через #[link(name = "ntdll")]

[features]
default = []
# Временный вход для проверяемой миграции; не постоянный второй backend.
c-core = ["dep:xipc-sys"]

# Политика линтов живёт в манифесте (Cargo 1.74+), а не в атрибутах крейта:
# так она распространяется на все таргеты (lib, tests) единообразно и видна
# сразу при чтении манифеста.
[lints.rust]
# В edition 2024 это дефолт, но `forbid` не даёт локально ослабить правило.
unsafe_op_in_unsafe_fn = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# Rust 1.99 (исследование 2026-10-16): `&raw` вместо `&x as *const _`,
# никаких лишних `as`, паника join-а worker-а не теряется в `let _ =`,
# pub-типы в сигнатурах реэкспортированы или `pub(crate)`.
raw_borrows_via_references = "warn"
trivial_casts = "warn"
let_underscore_drop = "warn"
unnameable_types = "warn"

[lints.clippy]
# Правило проекта №3 (CLAUDE.md): у каждого unsafe -- обоснование. Теперь это
# проверяет компилятор, а не ревьюер.
undocumented_unsafe_blocks = "deny"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
missing_const_for_fn = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
# Каждый unsafe-оп -- свой блок и свой `SAFETY` (разделяемая память).
multiple_unsafe_ops_per_block = "warn"
# Битовые касты знака -- только `cast_unsigned`/`cast_signed`.
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# `&raw`/`ptr::from_mut` вместо `&mut x as *mut _` в NT-вызовах.
borrow_as_ptr = "warn"
# Конвенция №8: `#[expect(.., reason)]`, а не `#[allow]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Без паник в библиотеке; тестам можно (`clippy.toml`).
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
