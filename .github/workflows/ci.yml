# CI xshm: форматирование, clippy, тесты x64/i686, rustdoc.
# Крейт работает только на Windows (NT API, TSO x86/x86_64) -- раннер только windows-latest.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml в .gitignore -- статический CRT задаём здесь, как локально
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_I686_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  ci:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Установка toolchain 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # Cargo.lock в .gitignore -- генерируем до кэша, чтобы ключ зависел от него
      - name: Генерация Cargo.lock
        shell: bash
        run: '[ -f Cargo.lock ] || cargo generate-lockfile'

      - name: Кэш cargo и target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: cargo fmt --check
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # Release-профиль даёт свои предупреждения (cfg(debug_assertions),
      # LTO-специфичный код): потребитель видел предупреждение только в release
      - name: cargo clippy --release
        run: cargo clippy --release --all-targets --target ${{ matrix.target }} -- -D warnings

      # Тесты делят имена объектов в \BaseNamedObjects -- только последовательно
      - name: cargo test
        run: cargo test --target ${{ matrix.target }} -- --test-threads=1

      - name: cargo doc
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
